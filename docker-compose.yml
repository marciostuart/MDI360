# Cole este arquivo no Portainer: Stacks -> Add stack -> Web editor.
# Ajuste apenas: o subdominio no label do Traefik e o nome da rede do Traefik.
services:
  signage:
    build: .
    # Se preferir imagem pronta em vez de build no servidor, troque por:
    # image: ghcr.io/SEU_USUARIO/signage:latest
    container_name: signage
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Postgres que ja roda na VPS. Use o nome do container, nao localhost.
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MAX: 10
      # MinIO que ja roda na VPS.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL}
    networks:
      - traefik
      - internal
    deploy:
      resources:
        limits:
          # Deixa folga para os outros servicos da VPS.
          memory: 1G
          cpus: "1.0"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.signage.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.signage.entrypoints=websecure"
      - "traefik.http.routers.signage.tls.certresolver=letsencrypt"
      - "traefik.http.services.signage.loadbalancer.server.port=3000"
      # SSE: desliga buffering para os comandos chegarem na hora nas TVs.
      - "traefik.http.middlewares.signage-sse.headers.customresponseheaders.X-Accel-Buffering=no"
      - "traefik.http.routers.signage.middlewares=signage-sse"

networks:
  traefik:
    external: true
    # Confirme o nome real com: docker network ls
    name: traefik
  internal:
    driver: bridge