# Docker SWARM (Portainer -> Stacks -> Add stack -> Web editor).
# Sua VPS roda em modo Swarm: sem "build", labels dentro de "deploy" e rede
# overlay externa (a mesma onde ja rodam traefik, postgres e minio).
version: "3.8"

services:
  signage:
    # Swarm nao constroi imagem. Construa antes em Portainer -> Images -> Build.
    # Use uma tag nova em cada build (ex.: signage:20260801-01). Reutilizar
    # "latest" pode fazer o Swarm iniciar a imagem antiga armazenada em cache.
    image: ${SIGNAGE_IMAGE:-signage:latest}
    environment:
      NODE_ENV: production
      PORT: 3000
      # No Swarm o host e o NOME DO SERVICO (postgres_postgres), nunca localhost.
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MAX: 10
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_INTERNAL_ENDPOINT: ${S3_INTERNAL_ENDPOINT:-}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS}
    networks:
      - net
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 15s
        max_attempts: 3
        window: 180s
      resources:
        limits:
          # Deixa folga para evolution, n8n, mautic, typebot etc.
          memory: 1G
          cpus: "1.0"
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${STACK_NETWORK:-360Network}"
        - "traefik.http.routers.signage.rule=Host(`${APP_HOST}`)"
        - "traefik.http.routers.signage.entrypoints=websecure"
        - "traefik.http.routers.signage.tls.certresolver=letsencrypt"
        - "traefik.http.services.signage.loadbalancer.server.port=3000"
        # SSE/streaming: desliga buffering para os comandos chegarem na hora nas TVs.
        - "traefik.http.middlewares.signage-sse.headers.customresponseheaders.X-Accel-Buffering=no"
        - "traefik.http.routers.signage.middlewares=signage-sse"

networks:
  net:
    external: true
    # Rede overlay onde ja rodam traefik, postgres e minio.
    name: ${STACK_NETWORK:-360Network}
