# Docker SWARM (Portainer -> Stacks -> Add stack -> Web editor).
# Sua VPS roda em modo Swarm, por isso: sem "build", labels dentro de "deploy",
# e redes externas do tipo overlay (as mesmas do traefik/postgres/minio).
version: "3.8"

services:
  signage:
    # Swarm nao constroi imagem. Construa antes na VPS (ver DEPLOY.md, Passo 5).
    image: ${SIGNAGE_IMAGE:-signage:latest}
    environment:
      NODE_ENV: production
      PORT: 3000
      # Use o NOME DO SERVICO do postgres/minio no Swarm, nunca localhost.
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MAX: 10
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS}
    networks:
      - traefik
      - data
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          # Deixa folga para evolution, n8n, mautic, typebot etc.
          memory: 1G
          cpus: "1.0"
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=${TRAEFIK_NETWORK:-360Network}"
        - "traefik.http.routers.signage.rule=Host(`${APP_HOST}`)"
        - "traefik.http.routers.signage.entrypoints=websecure"
        - "traefik.http.routers.signage.tls.certresolver=letsencrypt"
        - "traefik.http.services.signage.loadbalancer.server.port=3000"
        # SSE/streaming: desliga buffering para os comandos chegarem na hora nas TVs.
        - "traefik.http.middlewares.signage-sse.headers.customresponseheaders.X-Accel-Buffering=no"
        - "traefik.http.routers.signage.middlewares=signage-sse"

networks:
  traefik:
    external: true
    # Confirme o nome real: docker network ls
    name: ${TRAEFIK_NETWORK:-360Network}
  data:
    external: true
    # Rede onde postgres e minio estao. Muitas vezes e a MESMA do traefik.
    name: ${DATA_NETWORK:-360Network}
