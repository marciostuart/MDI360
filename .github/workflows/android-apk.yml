name: Compilar APK Android

# Roda quando voce clicar em "Run workflow" no GitHub, ou a cada push na pasta android/
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10"

      - name: Compilar o APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Renomear arquivo
        run: |
          mkdir -p saida
          cp android/app/build/outputs/apk/debug/app-debug.apk saida/mdi360-android.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v5
        with:
          name: mdi360-android-apk
          path: saida/mdi360-android.apk
          retention-days: 90

      - name: Publicar APK permanente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "MDI360 Player Android" \
              --notes "Versão atual do player MDI360 para TV Box, Smart TV Android e celular."
          gh release upload android-latest saida/mdi360-android.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
