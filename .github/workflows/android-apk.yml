name: Compilar APK Android

# Roda quando voce clicar em "Run workflow" no GitHub, ou a cada push na pasta android/
on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10"

      - name: Compilar o APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Renomear arquivo
        run: |
          mkdir -p saida
          cp android/app/build/outputs/apk/debug/app-debug.apk saida/mdi360-android.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v5
        with:
          name: mdi360-android-apk
          path: saida/mdi360-android.apk
          retention-days: 90
