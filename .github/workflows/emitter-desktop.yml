name: Aplicativo Emissor Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "electron-emitter/**"
      - ".github/workflows/emitter-desktop.yml"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: dist:win
            artifact: mdi360-emissor-windows
          - name: MiniOS Linux x64
            os: ubuntu-latest
            command: dist:linux
            artifact: mdi360-emissor-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron-emitter
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron-emitter/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Gerar instalador
        run: npm run ${{ matrix.command }}
      - name: Publicar artefato Windows
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: electron-emitter/release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publicar artefatos Linux
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            electron-emitter/release/*.deb
            electron-emitter/release/*.AppImage
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar downloads permanentes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar instaladores
        uses: actions/download-artifact@v4
        with:
          pattern: mdi360-emissor-*
          path: downloads
          merge-multiple: true
      - name: Criar ou atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create desktop-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "MDI360 Emissor Desktop" \
              --notes "Instaladores atuais do emissor de senhas para Windows e MiniOS/Linux."
          gh release upload desktop-latest downloads/* --repo "$GITHUB_REPOSITORY" --clobber
