name: Aplicativo Emissor Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "electron-emitter/**"
      - ".github/workflows/emitter-desktop.yml"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: dist:win
            artifact: mdi360-emissor-windows
          - name: MiniOS Linux x64
            os: ubuntu-latest
            command: dist:linux
            artifact: mdi360-emissor-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron-emitter
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron-emitter/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Gerar instalador
        run: npm run ${{ matrix.command }}
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: electron-emitter/release/*
          if-no-files-found: error
          retention-days: 30
